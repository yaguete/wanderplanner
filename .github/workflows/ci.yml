name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:trip-dates
      - run: npm run test:trip-tasks
      - run: npm run test:country-tasks
      - run: npm run test:task-labels
      - run: npm run test:day-summary
      - run: npm run test:assistant-context
      - run: npm run test:trip-origin
      - run: npm run test:text-highlight
      - run: npm run test:trip-sources
      - run: npm run test:map-day-scope
      - run: npm run test:geocode-validate
      - run: npm run test:airports
      - run: npm run test:flight-search
      - run: npm run build
      # eslint instalado (eslint-config-next); no se usa como gate todavía:
      # hay errores preexistentes en auth-context/trip-context/tailwind.config
      # que no pertenecen a T4B.1. `npm run lint` funciona en local.

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -c "import main"
