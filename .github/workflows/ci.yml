name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:trip-dates
      - run: npm run test:day-heading
      - run: npm run test:trip-tasks
      - run: npm run test:trip-budget
      - run: npm run test:country-tasks
      - run: npm run test:task-labels
      - run: npm run test:day-summary
      - run: npm run test:share-briefing
      - run: npm run test:share-summary
      - run: npm run test:share-targets
      - run: npm run test:assistant-context
      - run: npm run test:assistant-actions
      - run: npm run test:assistant-suggestions
      - run: npm run test:assistant-plan-signals
      - run: npm run test:assistant-api
      - run: npm run test:trip-origin
      - run: npm run test:text-highlight
      - run: npm run test:chronicle-search
      - run: npm run test:chronicle-html
      - run: npm run test:trip-sources
      - run: npm run test:inspirational-source
      - run: npm run test:instagram-url
      - run: npm run test:extraction-toast
      - run: npm run test:extraction-quips
      - run: npm run test:source-item-groups
      - run: npm run test:source-route-import
      - run: npm run test:map-day-scope
      - run: npm run test:geocode-validate
      - run: npm run test:place-suggest-rank
      - run: npm run test:place-search-bias
      - run: npm run test:unsplash
      - run: npm run test:map-destination
      - run: npm run test:mapbox-permanent
      - run: npm run test:airports
      - run: npm run test:booking-dates
      - run: npm run test:booking-search
      - run: npm run test:flight-search
      - run: npm run test:partner-trip
      - run: npm run test:partner-button
      - run: npm run test:trip-source-suggestions
      - run: npm run test:cookie-consent
      - run: npm run test:funnel-analytics
      - run: npm run test:blog-wp-search
      - run: npm run test:guest-trip-claim
      - run: npm run test:start-session
      - run: npm run test:account-security
      - run: npm run test:auth-errors
      - run: npm run test:auth-next
      - run: npm run test:auth-session-persist
      - run: npm run test:auth-google
      - run: npm run test:turnstile
      - run: npm run test:theme-scope
      - run: npm run test:theme-contrast
      - run: npm run test:onboarding
      - run: npm run test:visual-viewport
      - run: npm run test:mobile-browser-chrome
      - run: npm run test:trip-merge
      - run: npm run test:trip-share
      - run: npm run test:trip-invite-url
      - run: npm run test:trip-rail-mark
      - run: npm run test:trips-repo
      - run: npm run test:itinerary-calendar
      - run: npm run test:itinerary-utils
      - run: npm run test:maps-links
      - run: npm run test:itinerary-dnd
      - run: npm run test:item-span
      - run: npm run test:route-legs
      - run: npm run test:transport-routes
      # Gate desde el 15 ago 2026: cero errores. Los warnings de la era del React
      # Compiler (set-state-in-effect, refs, preserve-manual-memoization) están
      # degradados a warning en eslint.config.mjs y no bloquean.
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -c "import main"
      - run: pytest
